name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm bundle:mcpb
      - run: pnpm smoke:mcpb
      - run: pnpm exec mcpb info artifacts/balena-mcp.mcpb
      - run: pnpm pack --pack-destination artifacts
      - name: Check container startup and auth
        run: |
          docker build -t balena-mcp-ci .
          docker run --rm --entrypoint test balena-mcp-ci -f /app/LICENSE
          docker run -d --name balena-mcp-ci -p 127.0.0.1:3010:3000 \
            -e BALENA_API_TOKEN=test-token -e MCP_HTTP_AUTH_TOKEN=test-mcp-token \
            balena-mcp-ci
          trap 'docker rm -f balena-mcp-ci' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3010/health; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3010/mcp)" = 401

  # Auto-merge Dependabot minor/patch PRs once the checks above pass
  dependabot-automerge:
    needs: [check]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
